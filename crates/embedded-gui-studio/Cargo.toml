[package]
name = "embedded-gui-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Cross-platform interactive GUI studio for embedded-gui KDL live preview & code generation"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/embedded-gui-studio"
keywords = ["gui", "embedded", "kdl", "codegen", "studio"]
categories = ["embedded", "gui", "development-tools"]

[dependencies]
embedded-gui = { workspace = true, features = ["embedded-3dgfx"] }
embedded-gui-codegen = { workspace = true }
embedded-gui-live = { workspace = true, features = ["std"] }
embedded-graphics-core = { workspace = true }
kdl = { workspace = true }
eframe = { version = "0.31", default-features = true }
egui_extras = { version = "0.31", features = ["syntect"] }
nusb = "0.2"
rfd = "0.15"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zstd = "0.13"
flate2 = "1.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp"] }
