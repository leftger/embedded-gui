# Score only the core embedded-gui crate. Sibling crates (live, studio, …)
# and non-library trees are excluded from Codecov.
ignore:
  - "crates/embedded-gui-*/**"
  - "size_harness/**"
  - "examples/**"
  - "assets/**"
  - "docs/**"
  - "figma-plugin/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        paths:
          - crates/embedded-gui
    patch:
      default:
        target: 60%
        threshold: 1%
        paths:
          - crates/embedded-gui
