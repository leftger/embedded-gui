name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create GitHub Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev binutils-arm-none-eabi

      - name: Build embedded-gui-studio (host)
        run: |
          cargo build --release -p embedded-gui-studio
          tar -czf embedded-gui-studio-linux-x86_64.tar.gz -C target/release embedded-gui-studio

      - name: Build embedded size-harness ELF (thumbv7em)
        run: |
          cargo build --manifest-path size_harness/Cargo.toml --target thumbv7em-none-eabihf --release
          cp target/thumbv7em-none-eabihf/release/size_harness size_harness-thumbv7em.elf
          arm-none-eabi-size size_harness-thumbv7em.elf > size_harness-thumbv7em-report.txt

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p embedded-gui --token "${CARGO_REGISTRY_TOKEN}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            embedded-gui-studio-linux-x86_64.tar.gz
            size_harness-thumbv7em.elf
            size_harness-thumbv7em-report.txt
