# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2024-0437", # quick-xml quadratic runtime
    "RUSTSEC-2024-0438", # quick-xml namespace memory exhaustion
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2026-0192", # ttf-parser unmaintained
    "RUSTSEC-2026-0194", # quick-xml quadratic runtime
    "RUSTSEC-2026-0195", # quick-xml namespace memory exhaustion
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
