<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>embedded-gui Kitchen-Sink Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121417;
      font-family: system-ui, sans-serif;
      color: #e6e6e6;
    }
    main {
      text-align: center;
      padding: 24px;
      max-width: 720px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      touch-action: none;
    }
    p {
      margin-top: 18px;
      opacity: 0.75;
    }
    kbd {
      background: #262a2e;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main>
    <h1>embedded-gui kitchen-sink demo</h1>
    <!-- WebSimulatorDisplay appends its scaled canvas to document.body. -->
    <p>One RGB565 widget tree rendered from the same <code>no_std</code>-compatible <code>GuiContext</code> used on Cortex-M and RISC-V targets.</p>
    <p>Scroll inside the device with the mouse wheel, drag, or <kbd>Page Up</kbd>/<kbd>Page Down</kbd>. Click controls or use arrow keys + <kbd>Enter</kbd>.</p>
    <script type="module">
      import init from './pkg/embedded_gui_web_demo.js';
      await init();
    </script>
  </main>
</body>
</html>
